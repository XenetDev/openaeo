name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:web
        working-directory: apps/local
      - name: Build a release and test the installer against it
        run: |
          bun run release bun-linux-x64
          sh ../../deploy/installer/test.sh dist/release
        working-directory: apps/local
